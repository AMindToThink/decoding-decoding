# Source of truth for paper/refs.bib. Each [[cite]] = citation key + ONE
# identifier + the specific claim the paper makes against it.
#
# Regenerate the .bib with:  uv run python scripts/build_bib.py
# (requires network access to the arXiv API; see paper/CITATIONS.md)
#
# Keys are <firstauthor><venueyear><shorttitleword>, matching the first author
# the metadata resolves to.

[[cite]]
key   = "basu2021mirostat"
arxiv = "2007.14966"
claim = "Mirostat patches decoding-induced entropy drift with a feedback control loop on per-token surprise; the prior work this project extends to context-dependent belief modeling."

[[cite]]
key   = "guo2017calibration"
arxiv = "1706.04599"
claim = "Temperature scaling: post-hoc calibration by a single scalar T fit by NLL (the 'Guo MLE'); the batch calibrator the streaming filter is compared against in Exp A."

[[cite]]
key   = "liu2024temperature"
arxiv = "2311.09325"
claim = "Per-corpus temperature scaling of surprisal improves fit to human reading times; reports T ~ 2.5 on GPT-2 for naturalistic English via grid search."

[[cite]]
key   = "shen2024thermometer"
arxiv = "2403.08819"
claim = "Thermometer: universal LLM calibration that beats global T but requires auxiliary supervised training; the training-based alternative contrasted with our training-free per-context estimator."

[[cite]]
key   = "mitzenmacher2020algorithms"
arxiv = "2006.09123"
claim = "Algorithms-with-predictions framing (course topic): augmenting decisions with possibly-unreliable predictions; conceptual framing for treating the model's inferred decoder as a prediction."

[[cite]]
key   = "peng2025calibration"
arxiv = "2504.09096"
claim = "High-dimensional online calibration in polynomial time; calibration-theory context for online/streaming calibration."

[[cite]]
key   = "fishelson2025calibration"
arxiv = "2505.21460"
claim = "High-dimensional calibration from swap regret; calibration-theory context for high-dimensional calibration."

[[cite]]
key   = "vovk1998game"
doi   = "10.1006/jcss.1997.1556"
claim = "Aggregating Algorithm and mixability; log loss is 1-mixable, so the Bayes mixture over a finite expert set has per-sequence regret at most ln(1/prior weight) vs every expert."

[[cite]]
key   = "cesabianchi2006prediction"
doi   = "10.1017/CBO9780511546921"
claim = "Prediction-with-expert-advice framework: ch. 3 regret of exponentially weighted forecasters for mixable losses; ch. 9 continuous-prior mixture bounds for log loss over a bounded 1-parameter family."

[[cite]]
key   = "herbster1998tracking"
doi   = "10.1023/A:1007424614876"
claim = "Fixed-Share: sharing a fraction of posterior weight to the prior each step tracks the best m-segment expert sequence with regret ~ m ln(Kn/m); our switch_rate knob is the share-to-initial-prior variant."

[[cite]]
key   = "foster2018logistic"
arxiv = "1803.09349"
claim = "Proper online logistic-type predictors face an exp-concavity obstruction (regret exponential in the predictor norm) while improper mixture forecasters avoid it; the reason the certificate attaches to the grid mixture, not the Laplace point filter."

[[cite]]
key   = "naseh2023stealing"
arxiv = "2303.04729"
claim = "Stealing the Decoding Algorithms of Language Models (CCS'23): recovers temperature, top-k, and top-p from a black-box API via large query budgets on output statistics; prior art for the decoding-hyperparameter-inference goal, distinguished here by being black-box, offline, and aimed at a third-party API rather than the model's own logits."

[[cite]]
key   = "mikhaylovskiy2026temperature"
arxiv = "2601.02320"
claim = "Independently derives the same training-free per-sequence temperature MLE (observed logit sum = expected logit sum under softmax(beta*logits)), but offline (batch root-finder) and with no certificate; near-concurrent work (Jan 2026) whose 'ill-posed, awaiting regularization' gap the grid certificate addresses."
